name: Feature request
description: Propose an enhancement for dsh-claude-move
title: '[feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What gap or friction does this address? A concrete scenario helps most.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the plugin do, and where (tool / command / panel / config)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or rejected designs worth recording.
