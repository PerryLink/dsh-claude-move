name: Compat

# dshbase-style compatibility verification (monthly + on demand):
#   1. bare-import: install the packed tarball into an empty project (native
#      builds allowlisted) and import its entry - catches devDependencies
#      mistaken for dependencies and native-build gate regressions.
#   2. profile: install the tarball into a scratch DSH_HOME profile next to
#      dsh-base + dsh-headless, assert the bundle row mounts (dump-config), and
#      run one keyless headless task. MISSING_CREDENTIAL proves the plugin tree
#      loaded; a hang (pending service) hits the 120s timeout and fails, which
#      is exactly how a missing injected service surfaces.
#   3. uninstall: the profile install must be fully reversible.
# Platform guard: every assertion here is platform-neutral. Platform-specific
# behavior (Windows/macOS-only rows) is never asserted on this Linux runner.
#
# Baseline note (2026-09-04): this workflow pins published 0.1.2-rc.1 peers and
# therefore only exercises the LEGACY sessionPersistence API (service-level
# create/append/readFrom, list() returning headers). The handle seam
# (create returning a SessionHandle, list()/stat() returning snapshots,
# append+flush+close ownership) exists only on the unreleased checkout
# master/0.1.3-alpha.1 (bec6805d6a refactor) - no published version carries it,
# so the handle path can only be verified against a local checkout
# (see dev/checkout-handle.mjs, which runs the plugin against the checkout's
# real session-persistence-jsonl backend in an isolated DSH_HOME).
on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  bare-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Bare install + import smoke
        run: |
          set -euo pipefail
          TARBALL="$(ls "$RUNNER_TEMP"/dsh-claude-move-*.tgz | head -n1)"
          mkdir -p "$RUNNER_TEMP/bare" && cd "$RUNNER_TEMP/bare"
          pnpm init >/dev/null
          cat > pnpm-workspace.yaml <<'YAML'
          packages:
            - .
          nodeLinker: hoisted
          autoInstallPeers: true
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            koffi: true
            node-pty: true
            protobufjs: true
            '@google/genai': true
          YAML
          pnpm add "$TARBALL" >/dev/null
          node --input-type=module -e "import('dsh-claude-move').then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)})"
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.2-rc.1

      - name: Install into a scratch profile (builds allowlisted)
        run: |
          set -euo pipefail
          TARBALL="$(ls "$RUNNER_TEMP"/dsh-claude-move-*.tgz | head -n1)"
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          mkdir -p "$DSH_HOME/profiles/compat"
          cat > "$DSH_HOME/profiles/compat/pnpm-workspace.yaml" <<'YAML'
          packages:
            - .
          nodeLinker: hoisted
          autoInstallPeers: false
          allowBuilds:
            '@deepseek-ai/dsh-subprocess-local': true
            koffi: true
            node-pty: true
            protobufjs: true
            '@google/genai': true
          YAML
          dsh plugin --profile compat add '@deepseek-ai/dsh-base@0.1.2-rc.1' '@deepseek-ai/dsh-headless@0.1.2-rc.1' "$TARBALL"

      - name: Row-mount assertion
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh --profile compat --dump-config > dump.txt
          grep -q "dsh-claude-move" dump.txt

      - name: Keyless headless smoke
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          set +e
          timeout 120 dsh --profile compat "Reply with exactly: ok" > smoke.log 2>&1
          code="$?"
          set -e
          if grep -q 'MISSING_CREDENTIAL' smoke.log; then
            echo 'PASS: plugin tree loaded (keyless)'
          elif [ "$code" -eq 0 ] && grep -qiE '(^|[^a-z])ok([^a-z]|$)' smoke.log; then
            echo 'PASS: plugin tree loaded (with key)'
          else
            echo 'FAIL: headless smoke did not prove tree load'
            cat smoke.log
            exit 1
          fi

      - name: Uninstall
        run: |
          set -euo pipefail
          export DSH_HOME="$RUNNER_TEMP/dsh-home"
          dsh plugin --profile compat remove dsh-claude-move
