name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: npm test (Node 22, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The published-line type ruler. `check:ci` existed as a script but no
      # workflow ever invoked it, so the second type face was decorative on CI
      # (G-4b). It reports 0 errors after the JSDoc-only fixes in this branch.
      - name: Typecheck (published line)
        run: npm run check:ci

      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - run: npm run check:readmes
      - run: npm run verify:self-contained
      - run: npm run verify:artifacts
